name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 分步安装：先核心依赖，再可选依赖，最后测试工具
        pip install -e ".[dev]" || true
        pip install -e ".[llm,api,ui]" || true
        pip install -e ".[qdrant]" || true
        pip install langchain-openai langchain-ollama psutil || true
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        # 只收集 test_*.py，排除 benchmark/evaluate/demo 脚本
        # conftest.py 自动跳过依赖外部服务的测试
        pytest tests/test_*.py -v --cov=src --cov-report=xml --cov-report=term \
          --continue-on-collection-errors -p no:cacheprovider || true
      env:
        GITHUB_ACTIONS: "true"
        SILICONFLOW_API_KEY: mock-key-for-testing
        GROQ_API_KEY: mock-key-for-testing
        CEREBRAS_API_KEY: mock-key-for-testing
        ZHIPU_API_KEY: mock-key-for-testing
        LLM_BACKEND: none
        VECTOR_DB: chromadb

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      if: always()
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Check code formatting with black
      run: black --check --diff src/ || true

    - name: Check import sorting with isort
      run: isort --check-only --diff src/ || true

    - name: Lint with flake8
      run: |
        # 只扫描 src/，tests/ 有历史遗留语法问题
        # F-class 错误（未定义名称等）必须为 0，否则失败
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # 风格问题仅报告，不阻断 CI
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        # 分步安装，避免依赖冲突导致整个 job 失败
        pip install bandit || true
        pip install safety || true
        pip install pip-audit || true

    - name: Run Bandit security scan
      run: |
        bandit -r src/ -ll -f json -o bandit-report.json || true
        bandit -r src/ -ll || true

    - name: Check for known vulnerabilities
      run: |
        safety check --json || true
        safety check || true

    - name: Audit dependencies
      run: |
        pip-audit --format json || true
        pip-audit || true

    - name: Upload security reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: deep-rag:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm deep-rag:test python -c "import src; print('Import successful')"
