[project]
name = "deep-rag"
version = "0.2.9"
description = "DeepRAG - 自纠错多源知识Agent（Corrective RAG + Self-RAG + 冲突解决 + 离线启发式评测）"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
llm = [
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
]
ui = [
    "streamlit>=1.40.0",
]
api = [
    # FastAPI HTTP 服务（api.py）
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",  # FastAPI TestClient 依赖
]
qdrant = [
    # Qdrant 向量数据库（可选，生产推荐）
    "qdrant-client>=1.12.0",
]
pgvector = [
    # pgvector 向量数据库（可选，PostgreSQL扩展）
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
]
reranker = [
    # CrossEncoder 精排（可选）
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "pytest-html>=4.0",
    "pytest-cov>=5.0",
    "plotly>=5.0",
    "psutil>=5.9.0",
    # 质量工具（格式化 / 静态检查）
    "black",
    "isort",
    "ruff",
    "mypy",
    "pre-commit",
]
evaluation = [
    # RAGAS评测框架（可选，用于专业评测）
    # 注意：本项目已实现离线RAGAS评估器，无需安装ragas包
    # 如需使用官方RAGAS框架，可取消注释：
    # "ragas>=0.1.0",
]
observability = [
    # 链路追踪与 token 计费（src/observability，按需启用）
    "langfuse",
    "tiktoken",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests"]
