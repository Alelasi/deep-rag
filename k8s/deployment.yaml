# Kubernetes 部署配置

apiVersion: v1
kind: Namespace
metadata:
  name: deep-rag

---
# ConfigMap - 应用配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: deep-rag-config
  namespace: deep-rag
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  VECTOR_DB_TYPE: "lancedb"
  MODEL_NAME: "gpt-3.5-turbo"

---
# Deployment - Deep-RAG 应用
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deep-rag
  namespace: deep-rag
  labels:
    app: deep-rag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deep-rag
  template:
    metadata:
      labels:
        app: deep-rag
    spec:
      containers:
      - name: deep-rag
        image: deep-rag:v2.1
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: deep-rag-service
  namespace: deep-rag
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: deep-rag
