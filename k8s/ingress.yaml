apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deep-rag-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - deep-rag.example.com
    secretName: deep-rag-tls
  rules:
  - host: deep-rag.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: deep-rag-service
            port:
              number: 8000
